name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        env:
          BACKLINE_SUPABASE_URL: ${{ vars.BACKLINE_SUPABASE_URL }}
          BACKLINE_SUPABASE_ANON_KEY: ${{ secrets.BACKLINE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$BACKLINE_SUPABASE_URL" ] || [ -z "$BACKLINE_SUPABASE_ANON_KEY" ]; then
            echo "Missing BACKLINE_SUPABASE_URL repository variable or BACKLINE_SUPABASE_ANON_KEY repository secret."
            exit 1
          fi
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css field-polish.css app.js _site/
          cp -R assets _site/assets
          cat > _site/supabase-config.js <<EOF
          window.BACKLINE_SUPABASE_CONFIG = {
            environment: "production",
            url: "$BACKLINE_SUPABASE_URL",
            anonKey: "$BACKLINE_SUPABASE_ANON_KEY"
          };
          (function () {
            if (document.querySelector('link[href^="field-polish.css"]')) return;
            var polish = document.createElement("link");
            polish.rel = "stylesheet";
            polish.href = "field-polish.css?v=20260624-flat-meta-labels";
            document.head.appendChild(polish);
          })();
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
